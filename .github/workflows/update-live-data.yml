name: Update live World Cup data

on:
  schedule:
    # Every hour. football-data.org free tier allows 10 req/min,
    # this workflow makes 2 calls per run — plenty of headroom.
    - cron: '0 * * * *'
  workflow_dispatch: {}   # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest data
        env:
          # Optional but recommended: free token from
          # https://www.football-data.org/client/register
          # Gives both match results AND top-scorer goals.
          # If not set, falls back to worldcup26.ir / openfootball
          # (fixtures only — scorer goals then use scorers.json).
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 scripts/update_live_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-data.json
          git diff --quiet --cached || git commit -m "chore: update live World Cup data"
          git push origin master