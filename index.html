<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ Porra Mundial 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
    }

    .trophy { font-size: 4rem; display: block; margin-bottom: 20px; }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #f0c040;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #555;
      margin-bottom: 32px;
    }

    .divider {
      height: 1px;
      background: #222;
      margin: 0 0 32px;
    }

    .msg {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #ccc;
      margin-bottom: 24px;
    }

    .msg strong { color: #f0c040; }

    .note {
      font-size: 0.82rem;
      color: #555;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="trophy">🏆</span>
    <h1>Porra Mundial 2026</h1>
    <p class="subtitle">World Cup 2026</p>
    <div class="divider"></div>
    <p class="msg">
      El torneo ha finalizado.<br><br>
      La <strong>clasificación final</strong> y los resultados completos se comunicarán a todos los participantes <strong>por correo electrónico</strong>.
    </p>
    <p class="note">Gracias a todos por participar. ⚽</p>
  </div>
</body>
</html>
